<body class="bg-gray-100 min-h-screen">

```
<!-- ENCABEZADO -->
<header class="bg-blue-700 text-white p-4 shadow">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-xl font-bold">
            Panel de Administrador
        </h1>
        <p class="text-sm text-blue-100">
            Gestión de productos - Madek
        </p>
    </div>
</header>


<!-- CONTENIDO PRINCIPAL -->
<main class="max-w-2xl mx-auto p-4">

    <div class="bg-white rounded-2xl shadow p-5">

        <h2 class="text-lg font-bold text-gray-800 mb-5">
            Agregar nuevo producto
        </h2>


        <!-- NOMBRE -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Nombre del producto
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Ej: Protector Solar Bioaqua"
                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-blue-600"
            >
        </div>


        <!-- PRECIO -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Precio
            </label>

            <input
                type="number"
                id="productPrice"
                placeholder="Ej: 15000"
                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-blue-600"
            >
        </div>


        <!-- CATEGORÍA -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Categoría
            </label>

            <select
                id="productCategory"
                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-blue-600"
            >
                <option value="skincare">
                    Cuidado Facial
                </option>

                <option value="labios">
                    Labios
                </option>

                <option value="corporal">
                    Splash & Corporal
                </option>

                <option value="moda">
                    Moda Modesta
                </option>
            </select>
        </div>


        <!-- DESCRIPCIÓN -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Descripción
            </label>

            <textarea
                id="productDescription"
                rows="4"
                placeholder="Descripción del producto..."
                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-blue-600"
            ></textarea>
        </div>


        <!-- STOCK -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Stock disponible
            </label>

            <input
                type="number"
                id="productStock"
                min="0"
                value="0"
                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-blue-600"
            >
        </div>


        <!-- IMAGEN -->
        <div class="mb-5">

            <label class="block text-sm font-semibold text-gray-700 mb-1">
                Imagen del producto
            </label>

            <input
                type="file"
                id="productImage"
                accept="image/*"
                class="w-full border border-gray-300 rounded-xl p-3 bg-white"
            >

            <p class="text-xs text-gray-500 mt-2">
                Selecciona una imagen desde tu computador.
            </p>

        </div>


        <!-- PREVISUALIZACIÓN -->
        <div
            id="imagePreviewContainer"
            class="hidden mb-5"
        >

            <p class="text-sm font-semibold text-gray-700 mb-2">
                Vista previa
            </p>

            <img
                id="imagePreview"
                src=""
                alt="Vista previa"
                class="w-40 h-40 object-cover rounded-xl border border-gray-200"
            >

        </div>


        <!-- BOTÓN -->
        <button
            onclick="guardarProducto()"
            id="saveProductBtn"
            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-xl transition"
        >
            Guardar producto
        </button>


        <!-- MENSAJE -->
        <div
            id="message"
            class="hidden mt-4 p-3 rounded-xl text-sm text-center"
        ></div>

    </div>

</script>

</body>
</html>
